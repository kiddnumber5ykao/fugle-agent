# ⬆️【要上傳 2026-06-05 23:02】daily_market.yml — 每天:名字中文化 + 市場別(補上 Fugle 金鑰)
name: 每日 名字中文化 + 市場別

on:
  schedule:
    # 每天 台北 08:30(= UTC 00:30)填一次。上市/上櫃幾乎不變,一天一次很夠。
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: '範圍 all/positions/watchlist'
        type: string
        required: false
        default: all

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements.txt
      - name: 名字中文化 + 市場別
        env:
          SHEETS_WRITER_URL:        ${{ secrets.SHEETS_WRITER_URL }}
          PORTFOLIO_SHEET_URL:      ${{ secrets.PORTFOLIO_SHEET_URL }}
          FUGLE_MARKETDATA_API_KEY: ${{ secrets.FUGLE_MARKETDATA_API_KEY }}
          FUGLE_MOCK: "0"
        run: python scripts/run_step.py market ${{ inputs.scope || 'all' }}
