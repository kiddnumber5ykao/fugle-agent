# 🚀【最新待上傳 2026-06-12 · DEPLOY-0612】alert_watch.yml — 盯盤即時提醒(盤中長工作,排程錯峰重試)
name: 盯盤提醒 (盤中)
run-name: 盯盤提醒

on:
  workflow_dispatch:        # 保留手動(當備援)
  schedule:                 # GitHub 排程不保證準時,放多個錯峰時間輪流卡位(台北 = UTC+8)
    - cron: '1 1 * * 1-5'   # 09:01
    - cron: '11 1 * * 1-5'  # 09:11(後援)
    - cron: '21 1 * * 1-5'  # 09:21(後援)
    - cron: '41 1 * * 1-5'  # 09:41(後援)

concurrency:
  group: alert-watch
  cancel-in-progress: false   # 已在跑就讓它跑完;後援觸發會排隊→收盤後自己 no-op,不會砍掉正在盯的

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 300     # 撐一個交易日(約 4.5 小時)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements.txt
      - name: 盯盤
        env:
          FUGLE_MARKETDATA_API_KEY: ${{ secrets.FUGLE_MARKETDATA_API_KEY }}
          PORTFOLIO_SHEET_URL:      ${{ secrets.PORTFOLIO_SHEET_URL }}
          SHEETS_WRITER_URL:        ${{ secrets.SHEETS_WRITER_URL }}
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
          FUGLE_MOCK: "0"
          PLAN_TAB: "照哥計劃表"
          NEAR_PCT: "2"
          POLL_SEC: "60"
          MAX_MIN: "270"
        run: python scripts/watch_alerts.py
