name: 每日深度分析 (手動觸發)

on:
  # 自動排程暫時關閉 — 想啟用就把下面 schedule 那段取消註解
  # schedule:
  #   - cron: '0 7 * * 1-5'   # TW 15:00 收盤後
  workflow_dispatch:   # 手動 / app 按鈕觸發

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 跑深度分析
        env:
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          FUGLE_MARKETDATA_API_KEY: ${{ secrets.FUGLE_MARKETDATA_API_KEY }}
          SHEETS_WRITER_URL:        ${{ secrets.SHEETS_WRITER_URL }}
          PORTFOLIO_SHEET_URL:      ${{ secrets.PORTFOLIO_SHEET_URL }}
          ANTHROPIC_MODEL:          ${{ secrets.ANTHROPIC_MODEL }}
          FUGLE_MOCK: "0"
        run: python scripts/run_scheduled.py deep
