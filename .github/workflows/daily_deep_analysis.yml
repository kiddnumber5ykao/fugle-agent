# ⬆️【要上傳 2026-06-04 21:56】daily_deep_analysis.yml — ✅ 開每週自動刷公司基本面(週日晚上)
name: 深度分析 (每週自動 + 手動)

on:
  schedule:
    # ✅ 每週日 台北 20:00(= UTC 週日 12:00)自動刷一次公司基本面(估值/配息/營收/新聞/公司簡介)
    - cron: '0 12 * * 0'
  workflow_dispatch:
    inputs:
      scope:
        description: '要跑的範圍'
        type: choice
        required: false
        default: all
        options:
          - all
          - positions
          - watchlist
      symbols:
        description: '只跑這幾檔(逗號分隔,例如 6902,2330)留空=全跑'
        type: string
        required: false
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 深度分析較久,給 30 分上限
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 跑深度分析
        env:
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          FUGLE_MARKETDATA_API_KEY: ${{ secrets.FUGLE_MARKETDATA_API_KEY }}
          SHEETS_WRITER_URL:        ${{ secrets.SHEETS_WRITER_URL }}
          PORTFOLIO_SHEET_URL:      ${{ secrets.PORTFOLIO_SHEET_URL }}
          ANTHROPIC_MODEL:          ${{ secrets.ANTHROPIC_MODEL }}
          FUGLE_MOCK: "0"
        run: python scripts/run_scheduled.py deep ${{ inputs.scope || 'all' }} "${{ inputs.symbols }}"
