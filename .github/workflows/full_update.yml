# 🔖最新批次 NH-0608-1158 ｜ ⬆️【要上傳】full_update.yml — 新增 lights job:每次全更新順手重算燈號快取
name: 全更新 (重算+技術+基本面)
run-name: 全更新 [${{ inputs.scope || 'all' }}]

on:
  workflow_dispatch:
    inputs:
      scope:
        description: '範圍 all/positions/watchlist'
        type: string
        required: false
        default: all

env:
  ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
  FUGLE_MARKETDATA_API_KEY: ${{ secrets.FUGLE_MARKETDATA_API_KEY }}
  SHEETS_WRITER_URL:        ${{ secrets.SHEETS_WRITER_URL }}
  PORTFOLIO_SHEET_URL:      ${{ secrets.PORTFOLIO_SHEET_URL }}
  ANTHROPIC_MODEL:          ${{ secrets.ANTHROPIC_MODEL }}
  FUGLE_MOCK: "0"

jobs:
  resync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/run_step.py resync ${{ inputs.scope || 'all' }}

  market:
    needs: resync
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements.txt
      # 完整版:市場別(含冷門上櫃 Fugle 備援)+ 名字中文化。獨立 job、不擋技術/基本面。
      - run: python scripts/run_step.py market ${{ inputs.scope || 'all' }}

  technical:
    needs: resync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/run_step.py technical ${{ inputs.scope || 'all' }}

  fundamental:
    needs: resync
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/run_step.py fundamental ${{ inputs.scope || 'all' }}

  recompute:
    needs: [technical, fundamental]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/run_step.py recompute ${{ inputs.scope || 'all' }}

  # 🆕 每次全更新(新交易/新追蹤)都把燈號快取重算一遍。
  #    盤中 = 即時三盞燈;非盤中(週末/收盤後)= 用最後一次收盤資料算,至少不空白。
  #    與 market/technical/fundamental 並行,resync 完就跑、不互相擋。
  lights:
    needs: resync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/run_step.py lights ${{ inputs.scope || 'all' }}
