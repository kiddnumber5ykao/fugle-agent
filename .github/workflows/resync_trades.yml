# 📅 最後更新:2026-05-29
name: 重算交易 + 補名稱 (手動觸發)

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 跑重算 + 補名稱
        env:
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          FUGLE_MARKETDATA_API_KEY: ${{ secrets.FUGLE_MARKETDATA_API_KEY }}
          SHEETS_WRITER_URL:        ${{ secrets.SHEETS_WRITER_URL }}
          PORTFOLIO_SHEET_URL:      ${{ secrets.PORTFOLIO_SHEET_URL }}
          FUGLE_MOCK: "0"
        run: python scripts/run_resync.py
