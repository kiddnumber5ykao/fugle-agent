# 📅 ★最新版★ 上傳於 2026-06-01 14:33  (原最後更新 2026-05-29)(多 job:重算→技術→重算我該做啥)
name: 盤中更新 (重算+技術)
run-name: 盤中更新 [${{ inputs.scope || 'all' }}]

on:
  workflow_dispatch:
    inputs:
      scope:
        description: '範圍 all/positions/watchlist'
        type: string
        required: false
        default: all
  schedule:
    # 台股開盤 9:00–13:30(台北)= UTC 01:00–05:30,每 15 分自動跑盤中更新
    # (只更新技術面 + 我該做啥,免費,不花 AI 錢)。排程觸發時 scope 預設 all。
    - cron: "*/15 1-5 * * 1-5"

env:
  ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
  FUGLE_MARKETDATA_API_KEY: ${{ secrets.FUGLE_MARKETDATA_API_KEY }}
  SHEETS_WRITER_URL:        ${{ secrets.SHEETS_WRITER_URL }}
  PORTFOLIO_SHEET_URL:      ${{ secrets.PORTFOLIO_SHEET_URL }}
  ANTHROPIC_MODEL:          ${{ secrets.ANTHROPIC_MODEL }}
  FUGLE_MOCK: "0"

jobs:
  resync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/run_step.py resync ${{ inputs.scope || 'all' }}

  technical:
    needs: resync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/run_step.py technical ${{ inputs.scope || 'all' }}

  recompute:
    needs: technical
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/run_step.py recompute ${{ inputs.scope || 'all' }}
