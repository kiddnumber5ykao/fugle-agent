name: 盤中更新 (重算+技術)
run-name: 盤中更新 [${{ inputs.scope || 'all' }}]

on:
  workflow_dispatch:
    inputs:
      scope:
        description: '範圍 all/positions/watchlist'
        type: string
        required: false
        default: all
  # ⛔ 2026-06-04 關閉自動排程 — 走勢已改成「打開頁面即時算」,這個 15 分批次不再需要。
  # 想暫時手動跑還是可以(上面 workflow_dispatch)。要恢復自動就把下面三行取消註解。
  # schedule:
  #   - cron: "*/15 1-5 * * 1-5"

env:
  ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
  FUGLE_MARKETDATA_API_KEY: ${{ secrets.FUGLE_MARKETDATA_API_KEY }}
  SHEETS_WRITER_URL:        ${{ secrets.SHEETS_WRITER_URL }}
  PORTFOLIO_SHEET_URL:      ${{ secrets.PORTFOLIO_SHEET_URL }}
  ANTHROPIC_MODEL:          ${{ secrets.ANTHROPIC_MODEL }}
  FUGLE_MOCK: "0"

jobs:
  resync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/run_step.py resync ${{ inputs.scope || 'all' }}

  technical:
    needs: resync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/run_step.py technical ${{ inputs.scope || 'all' }}

  recompute:
    needs: technical
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/run_step.py recompute ${{ inputs.scope || 'all' }}
