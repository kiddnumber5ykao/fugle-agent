name: 盤中技術分析 (手動觸發)

on:
  # 自動排程暫時關閉 — 想啟用就把下面 schedule 那段取消註解
  # schedule:
  #   - cron: '10 1-6 * * 1-5'
  #   - cron: '40 1-5 * * 1-5'
  workflow_dispatch:
    inputs:
      scope:
        description: '要跑的範圍'
        type: choice
        required: false
        default: all
        options:
          - all
          - positions
          - watchlist
      symbols:
        description: '只跑這幾檔(逗號分隔,例如 6902,2330)留空=全跑'
        type: string
        required: false
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 跑技術分析
        env:
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          FUGLE_MARKETDATA_API_KEY: ${{ secrets.FUGLE_MARKETDATA_API_KEY }}
          SHEETS_WRITER_URL:        ${{ secrets.SHEETS_WRITER_URL }}
          PORTFOLIO_SHEET_URL:      ${{ secrets.PORTFOLIO_SHEET_URL }}
          FUGLE_MOCK: "0"
        run: python scripts/run_scheduled.py technical ${{ inputs.scope || 'all' }} "${{ inputs.symbols }}"
