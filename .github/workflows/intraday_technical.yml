name: 盤中技術分析 (週一~五 09:10~14:10 每 30 分)

on:
  schedule:
    # GitHub Actions cron 用 UTC,台灣 TW = UTC+8
    # ─────────────────────────────────────────────────
    # TW 09:10, 10:10, 11:10, 12:10, 13:10, 14:10 = UTC 01:10, 02:10, ..., 06:10
    - cron: '10 1-6 * * 1-5'
    # TW 09:40, 10:40, 11:40, 12:40, 13:40         = UTC 01:40, 02:40, ..., 05:40
    - cron: '40 1-5 * * 1-5'
  workflow_dispatch:   # 手動觸發按鈕(方便測試)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 跑技術分析
        env:
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          FUGLE_MARKETDATA_API_KEY: ${{ secrets.FUGLE_MARKETDATA_API_KEY }}
          SHEETS_WRITER_URL:        ${{ secrets.SHEETS_WRITER_URL }}
          PORTFOLIO_SHEET_URL:      ${{ secrets.PORTFOLIO_SHEET_URL }}
          FUGLE_MOCK: "0"
        run: python scripts/run_scheduled.py technical
